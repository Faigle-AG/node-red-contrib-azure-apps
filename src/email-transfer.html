<script type="text/javascript">
    RED.nodes.registerType('azure-email-transfer', {
        category: 'azure',
        color: '#0072C6',
        paletteLabel: 'email-transfer',
        defaults: {
            name: { value: '' },
            config: { type: 'azure-email-config', required: true },
            dynamic: { value: false },
            messageId: {
                value: 'email.messageId',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;
                    var builtInValidator = RED.validators.typedInput('messageIdType');
                    return builtInValidator.call(this, v);
                },
            },
            messageIdType: { value: 'msg' },
            destinationId: { value: 'archive', required: true },
            destinationName: { value: 'Archive' },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-exchange',
        label: function () {
            return this.name || 'email - transfer';
        },
        oneditprepare: function () {
            var currentDestinationId = this.destinationId || 'archive';
            var currentDestinationName = this.destinationName || 'Archive';

            $('#node-input-messageId').typedInput({
                default: 'msg',
                types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env'],
                typeField: $('#node-input-messageIdType'),
            });

            var folderSelect = $('#node-input-destinationId');

            folderSelect
                .empty()
                .append(
                    $('<option></option>').val(currentDestinationId).text(currentDestinationName),
                );

            folderSelect.on('change', function () {
                $('#node-input-destinationName').val(
                    $('#node-input-destinationId option:selected').text(),
                );
            });

            function loadFolders(showWarning) {
                var configId = $('#node-input-config').val();
                var button = $('#node-input-loadFolders');
                var selectedDestinationId = folderSelect.val() || currentDestinationId;
                var selectedDestinationName =
                    $('#node-input-destinationName').val() || currentDestinationName;

                if (!configId || configId === '_ADD_') {
                    if (showWarning)
                        RED.notify('Select and deploy an Email Config first.', 'warning');
                    return;
                }

                button.prop('disabled', true);
                folderSelect.prop('disabled', true);

                $.getJSON('email-transfer/folders', { config: configId })
                    .done(function (response) {
                        var folders = Array.isArray(response) ? response : response.folders || [];

                        folderSelect.empty();

                        folders.forEach(function (folder) {
                            folderSelect.append(
                                $('<option></option>').val(folder.id).text(folder.path),
                            );
                        });

                        var selectedOption = folderSelect.find('option').filter(function () {
                            return $(this).val() === selectedDestinationId;
                        });

                        if (!selectedOption.length && selectedDestinationName) {
                            selectedOption = folderSelect.find('option').filter(function () {
                                return $(this).text() === selectedDestinationName;
                            });
                        }

                        if (selectedOption.length) {
                            folderSelect.val(selectedOption.first().val());
                        } else if (folderSelect.find('option').length) {
                            folderSelect.prop('selectedIndex', 0);
                        }

                        folderSelect.trigger('change');
                    })
                    .fail(function (xhr) {
                        var message =
                            xhr.responseJSON && xhr.responseJSON.message
                                ? xhr.responseJSON.message
                                : 'Unable to load mail folders.';

                        if (showWarning) RED.notify(message, 'error');
                    })
                    .always(function () {
                        button.prop('disabled', false);
                        folderSelect.prop('disabled', false);
                    });
            }

            $('#node-input-loadFolders').on('click', function () {
                loadFolders(true);
            });

            $('#node-input-dynamic').on('change', function () {
                if ($(this).prop('checked')) $('#email-options-group').hide();
                else $('#email-options-group').show();

                $('#node-input-messageId').trigger('change');
            });

            $('#node-input-dynamic').trigger('change');
            loadFolders(false);
        },
    });
</script>

<script type="text/markdown" data-help-name="azure-email-transfer">
Moves an email to a selected Microsoft Graph mail folder using the selected **Azure Config**.

### Properties

- **Email Config** _config_ \
  Shared mailbox and Azure authentication configuration.

- **Load from msg.email** _boolean_ \
  If enabled, the node will ignore the UI properties and expect `msg.email.messageId` and `msg.email.destinationId` to be provided dynamically.

- **Message ID** _string | msg | flow | global | jsonata | env_ \
  The unique Microsoft Graph ID of the message to move.

- **Dest. Folder** _string_ \
  The Microsoft Graph mail folder ID to which the message will be moved. Use the refresh button to retrieve all root and nested folders for a static User ID / Email.

Folder loading in the editor requires a deployed **Email Config** whose **User ID / Email** uses the static `str` type. Dynamic account values cannot be resolved until the node receives a message.

---

### Inputs

- **msg.email** _object_ \
  The incoming message triggers the operation.

  - **msg.email.messageId** _string_ \
    The Microsoft Graph ID of the message to move.

  - **msg.email.destinationId** _string_ \
    The Microsoft Graph ID or well-known name of the target folder.

  - **msg.email.destinationName** _string_ \
    Optional display name or path for the selected destination folder.

### Outputs

- **msg.email** _object_ \
  The object containing the event details.

  - **msg.email.action** _string_ \
    The action performed (`transfer`).

  - **msg.email.userId** _string_ \
    The resolved UserPrincipalName or Azure Object ID.

  - **msg.email.messageId** _string_ \
    The ID of the transferred message.

  - **msg.email.destinationId** _string_ \
    The Microsoft Graph ID or well-known name of the destination folder.

  - **msg.email.destinationName** _string_ \
    The configured destination folder display name or path.

  - **msg.email.apiResponse** _object_ \
    The Microsoft Graph message object returned after the move operation.
</script>
