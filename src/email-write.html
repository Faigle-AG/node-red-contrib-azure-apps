<script type="text/javascript">
    RED.nodes.registerType('azure-email-write', {
        category: 'azure',
        color: '#0072C6',
        paletteLabel: 'email-write',
        defaults: {
            name: { value: '' },
            config: { type: 'azure-email-config', required: true },
            dynamic: { value: false },
            to: {
                value: 'email.to',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;
                    var builtInValidator = RED.validators.typedInput('toType');
                    return builtInValidator.call(this, v);
                },
            },
            toType: { value: 'msg' },
            subject: {
                value: 'email.subject',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;
                    var builtInValidator = RED.validators.typedInput('subjectType');
                    return builtInValidator.call(this, v);
                },
            },
            subjectType: { value: 'msg' },
            body: {
                value: 'email.body',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;
                    var builtInValidator = RED.validators.typedInput('bodyType');
                    return builtInValidator.call(this, v);
                },
            },
            bodyType: { value: 'msg' },
            attachments: {
                value: 'email.attachments',
                validate: function (v) {
                    if (!v || v.trim() === '') return true;
                    var builtInValidator = RED.validators.typedInput('attachmentsType');
                    return builtInValidator.call(this, v);
                },
            },
            attachmentsType: { value: 'msg' },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-paper-plane',
        label: function () {
            return this.name || 'email - write';
        },
        oneditprepare: function () {
            $('#node-input-to').typedInput({
                default: 'msg',
                types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env'],
                typeField: $('#node-input-toType'),
            });
            $('#node-input-subject').typedInput({
                default: 'msg',
                types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env'],
                typeField: $('#node-input-subjectType'),
            });
            $('#node-input-body').typedInput({
                default: 'msg',
                types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env'],
                typeField: $('#node-input-bodyType'),
            });
            $('#node-input-attachments').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-attachmentsType'),
            });

            $('#node-input-dynamic').on('change', function () {
                if ($(this).prop('checked')) $('#email-options-group').hide();
                else $('#email-options-group').show();

                $('#node-input-to').trigger('change');
                $('#node-input-subject').trigger('change');
                $('#node-input-body').trigger('change');
                $('#node-input-attachments').trigger('change');
            });

            $('#node-input-dynamic').trigger('change');
        },
    });
</script>

<script type="text/markdown" data-help-name="azure-email-write">
Sends an email from an Azure user's mailbox through Microsoft Graph using the selected **Azure Config**.

### Properties

- **Email Config** _config_ \
  Shared mailbox and Azure authentication configuration.

- **Load from msg.email** _boolean_ \
  If enabled, the node ignores the UI properties and expects `msg.email.to`, `msg.email.subject`, `msg.email.body`, and optionally `msg.email.attachments` to be provided dynamically.

- **To** _string | msg_ \
  A comma-separated list of recipient email addresses.

- **Subject** _string | msg_ \
  The subject line of the email.

- **Body** _string | msg_ \
  The HTML or plain text body of the email.

- **Attachments** _msg_ \
  An array of objects containing `name` and `content` (base64 string or Node.js Buffer).

---

### Inputs

- **msg.email** _object_ \
  The incoming message triggers the operation.

  - **msg.email.to** _string_ \
    The destination email addresses.

  - **msg.email.subject** _string_ \
    The email subject.

  - **msg.email.body** _string_ \
    The body of the email.

  - **msg.email.attachments** _array_ (optional) \
    `[{ name: "file.pdf", content: <Buffer or Base64 String>, contentType: "application/pdf" }]`

### Outputs

- **msg.email** _object_ \
  The object containing the event details.

  - **msg.email.action** _string_ \
    The action performed (`write`).

  - **msg.email.status** _string_ \
    The status of the operation (`sent`).
</script>
