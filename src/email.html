<script type="text/javascript">
    RED.nodes.registerType('azure-read-email', {
        category: 'azure',
        color: '#0072C6',
        defaults: {
            name: { value: '' },
            userId: { value: '', required: true },
            limit: { value: 10, required: true, validate: RED.validators.number() },
            output: { value: 'email', required: true },
            outputType: { value: 'msg' },
        },
        oneditprepare: function () {
            $('#node-input-output').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-outputType'),
            });
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-envelope',
        label: function () {
            return this.name || 'azure read email';
        },
    });
</script>

<script type="text/markdown" data-help-name="azure-read-email">
Reads emails from an Azure user's inbox utilizing the `@azure/identity` `DefaultAzureCredential`.

### Properties

- **Name** _string_ \
  The label of the node in the workspace.

- **User ID / Email** _string_ \
  The UserPrincipalName or Azure Object ID of the user whose inbox you want to read.

- **Email Count** _number_ \
  The maximum number of emails to return (maps to OData `$top`).

- **Output to** _msg | flow | global_ \
  The destination property where the retrieved array of emails will be stored.
</script>
