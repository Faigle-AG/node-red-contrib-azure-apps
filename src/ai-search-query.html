<script type="text/javascript">
    RED.nodes.registerType('azure-ai-search-query', {
        category: 'azure',
        color: '#0072C6',
        defaults: {
            name: { value: '' },
            config: { type: 'azure-auth-config', required: true },
            endpoint: {
                value: '',
                required: true,
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('endpointType').call(this, v);
                },
            },
            endpointType: { value: 'str' },
            indexName: {
                value: '',
                required: true,
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('indexNameType').call(this, v);
                },
            },
            indexNameType: { value: 'str' },
            query: { value: 'payload' },
            queryType: { value: 'msg' },
            querySyntax: { value: 'simple' },
            searchMode: { value: 'any' },
            searchFields: { value: '' },
            select: { value: '' },
            filter: { value: '' },
            top: {
                value: 10,
                validate: function (v) {
                    return v === '' || (Number.isInteger(Number(v)) && Number(v) >= 1);
                },
            },
            skip: {
                value: '',
                validate: function (v) {
                    return v === '' || (Number.isInteger(Number(v)) && Number(v) >= 0);
                },
            },
            count: { value: false },
            semanticConfiguration: { value: '' },
            additionalParameters: { value: '{}' },
            additionalParametersType: { value: 'json' },
            output: { value: 'payload', required: true },
            outputType: { value: 'msg' },
            outputMode: { value: 'documents', required: true },
            timeoutMs: {
                value: 30000,
                required: true,
                validate: function (v) {
                    return Number.isInteger(Number(v)) && Number(v) >= 1000;
                },
            },
            enableLogging: { value: false },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-search',
        paletteLabel: 'ai search - query',
        label: function () {
            return (
                this.name || (this.indexName ? 'Search: ' + this.indexName : 'ai search - query')
            );
        },
        oneditprepare: function () {
            $('#node-input-endpoint').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-endpointType'),
            });
            $('#node-input-indexName').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-indexNameType'),
            });
            $('#node-input-query').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-queryType'),
            });
            $('#node-input-additionalParameters').typedInput({
                default: 'json',
                types: ['json', 'msg', 'flow', 'global', 'jsonata', 'env'],
                typeField: $('#node-input-additionalParametersType'),
            });
            $('#node-input-output').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-outputType'),
            });
        },
    });
</script>

<script type="text/markdown" data-help-name="azure-ai-search-query">
Searches documents in an Azure AI Search index using the Search Documents REST API (`api-version=2026-04-01`).

### Authentication

Authentication is supplied by the selected **Azure Config**.

- **Microsoft Entra ID** requests a token for `https://search.azure.com/.default`.
- **API key** uses the generic API key stored in Azure Config and sends it in the `api-key` request header.

For query-only Entra access, assign the Node-RED identity the **Search Index Data Reader** role on the Azure AI Search service.

### Properties

- **Azure Config** _config_ \
  Existing shared Azure authentication configuration. No changes are required.

- **Endpoint** _string | env | msg | flow | global | jsonata_ \
  Search service endpoint, for example `https://my-search-service.search.windows.net`.

- **Index** _string | env | msg | flow | global | jsonata_ \
  Search index name or supported index alias.

- **Search Text** _typed value_ \
  Query text. The default is `msg.payload`. If it resolves empty and no vector query is supplied, the node sends `search: "*"`.

- **Query Type** _simple | full | semantic_ \
  Azure AI Search query parser mode.

- **Search Mode** _any | all_ \
  Controls whether any or all search terms must match.

- **Search Fields**, **Select**, **Filter** \
  Optional Azure AI Search request parameters.

- **Top**, **Skip**, **Return total count** \
  Result paging/count options.

- **Semantic Config** \
  Optional semantic configuration name, normally used together with Query Type = `semantic`.

- **Parameters** _JSON | msg | flow | global | jsonata | env_ \
  Additional Search Documents POST body properties. These values are applied after the editor fields and therefore can override them. Use this for advanced options such as `vectorQueries`, `facets`, `answers`, `captions`, `orderby`, `scoringProfile`, or `semanticQuery`.

  Example vector query:

  ```json
  {
      "vectorQueries": [
          {
              "kind": "text",
              "text": "how do clouds form",
              "fields": "contentVector",
              "k": 5
          }
      ]
  }
  ```

- **Value** _documents only | complete response object_ \
  Chooses what is written to the configured output property.

- **Output To** _msg | flow | global_ \
  Destination for the selected output value.

### Output

The incoming message is forwarded. Metadata is written to:

```js
msg.azureSearch = {
    requestId,
    indexName,
    apiVersion,
    count,
    coverage,
    answers,
    documentsReturned
};
```

With **Documents only**, the configured output receives the service response `value` array. With **Complete response object**, it receives the full JSON response.
</script>
