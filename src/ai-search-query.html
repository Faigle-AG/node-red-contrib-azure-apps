<script type="text/javascript">
    function azureSearchQueryTypedValidator(field, literalType, validateLiteral) {
        return function (v) {
            var typeField = $('#node-input-' + field + 'Type');
            var type =
                (typeField.length ? typeField.val() : '') || this[field + 'Type'] || literalType;
            if (type === literalType) return validateLiteral ? validateLiteral(v) : true;
            if (typeof v !== 'string' || !v.trim()) return false;
            return RED.validators.typedInput(field + 'Type').call(this, v) === true;
        };
    }

    function azureSearchQueryIntegerValidator(min, optional) {
        return function (v) {
            if (typeof v === 'string') v = v.trim();
            if (v === '' || v === null || v === undefined) return optional;
            return (
                (typeof v === 'string' || typeof v === 'number') &&
                Number.isSafeInteger(Number(v)) &&
                Number(v) >= min
            );
        };
    }

    function azureSearchQueryBooleanValidator(v) {
        return v === true || v === false || v === 'true' || v === 'false';
    }

    RED.nodes.registerType('azure-ai-search-query', {
        category: 'azure',
        color: '#0072C6',
        defaults: {
            name: { value: '' },
            config: { type: 'azure-auth-config', required: true },
            endpoint: {
                value: '',
                required: true,
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('endpointType').call(this, v);
                },
            },
            endpointType: { value: 'str' },
            indexName: {
                value: '',
                required: true,
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('indexNameType').call(this, v);
                },
            },
            indexNameType: { value: 'str' },
            query: { value: 'payload' },
            queryType: { value: 'msg' },
            querySyntax: {
                value: 'simple',
                validate: azureSearchQueryTypedValidator('querySyntax', 'str', function (v) {
                    return ['simple', 'full', 'semantic'].indexOf(v) !== -1;
                }),
            },
            querySyntaxType: { value: 'str' },
            searchMode: {
                value: 'any',
                validate: azureSearchQueryTypedValidator('searchMode', 'str', function (v) {
                    return ['any', 'all'].indexOf(v) !== -1;
                }),
            },
            searchModeType: { value: 'str' },
            searchFields: {
                value: '',
                validate: azureSearchQueryTypedValidator('searchFields', 'str'),
            },
            searchFieldsType: { value: 'str' },
            select: { value: '', validate: azureSearchQueryTypedValidator('select', 'str') },
            selectType: { value: 'str' },
            filter: { value: '', validate: azureSearchQueryTypedValidator('filter', 'str') },
            filterType: { value: 'str' },
            top: {
                value: 10,
                validate: azureSearchQueryTypedValidator(
                    'top',
                    'num',
                    azureSearchQueryIntegerValidator(1, true),
                ),
            },
            topType: { value: 'num' },
            skip: {
                value: '',
                validate: azureSearchQueryTypedValidator(
                    'skip',
                    'num',
                    azureSearchQueryIntegerValidator(0, true),
                ),
            },
            skipType: { value: 'num' },
            count: {
                value: false,
                validate: azureSearchQueryTypedValidator(
                    'count',
                    'bool',
                    azureSearchQueryBooleanValidator,
                ),
            },
            countType: { value: 'bool' },
            semanticConfiguration: {
                value: '',
                validate: azureSearchQueryTypedValidator('semanticConfiguration', 'str'),
            },
            semanticConfigurationType: { value: 'str' },
            additionalParameters: { value: '{}' },
            additionalParametersType: { value: 'json' },
            output: { value: 'payload', required: true },
            outputType: { value: 'msg' },
            outputMode: {
                value: 'documents',
                required: true,
                validate: azureSearchQueryTypedValidator('outputMode', 'str', function (v) {
                    return ['documents', 'response'].indexOf(v) !== -1;
                }),
            },
            outputModeType: { value: 'str' },
            timeoutMs: {
                value: 30000,
                required: true,
                validate: azureSearchQueryTypedValidator(
                    'timeoutMs',
                    'num',
                    azureSearchQueryIntegerValidator(1000, false),
                ),
            },
            timeoutMsType: { value: 'num' },
            enableLogging: {
                value: false,
                validate: azureSearchQueryTypedValidator(
                    'enableLogging',
                    'bool',
                    azureSearchQueryBooleanValidator,
                ),
            },
            enableLoggingType: { value: 'bool' },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-search',
        paletteLabel: 'ai search - query',
        label: function () {
            return (
                this.name || (this.indexName ? 'Search: ' + this.indexName : 'ai search - query')
            );
        },
        oneditprepare: function () {
            $('#node-input-endpoint').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-endpointType'),
            });
            $('#node-input-indexName').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-indexNameType'),
            });
            $('#node-input-query').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-queryType'),
            });
            ['searchFields', 'select', 'filter', 'semanticConfiguration'].forEach(function (field) {
                $('#node-input-' + field).typedInput({
                    default: 'str',
                    types: ['str', 'msg', 'flow', 'global', 'env', 'jsonata'],
                    typeField: $('#node-input-' + field + 'Type'),
                });
            });
            [
                {
                    field: 'querySyntax',
                    options: [
                        { value: 'simple', label: 'Simple' },
                        { value: 'full', label: 'Full Lucene' },
                        { value: 'semantic', label: 'Semantic' },
                    ],
                },
                {
                    field: 'searchMode',
                    options: [
                        { value: 'any', label: 'Any term' },
                        { value: 'all', label: 'All terms' },
                    ],
                },
                {
                    field: 'outputMode',
                    options: [
                        { value: 'documents', label: 'Documents only' },
                        { value: 'response', label: 'Complete response object' },
                    ],
                },
            ].forEach(function (setting) {
                $('#node-input-' + setting.field).typedInput({
                    default: 'str',
                    types: [
                        { value: 'str', label: 'value', options: setting.options },
                        'msg',
                        'flow',
                        'global',
                        'env',
                        'jsonata',
                    ],
                    typeField: $('#node-input-' + setting.field + 'Type'),
                });
            });
            [
                { field: 'top', min: 1, optional: true },
                { field: 'skip', min: 0, optional: true },
                { field: 'timeoutMs', min: 1000, optional: false },
            ].forEach(function (setting) {
                $('#node-input-' + setting.field).typedInput({
                    default: 'num',
                    types: [
                        {
                            value: 'num',
                            label: 'number',
                            icon: 'fa fa-hashtag',
                            validate: azureSearchQueryIntegerValidator(
                                setting.min,
                                setting.optional,
                            ),
                        },
                        'msg',
                        'flow',
                        'global',
                        'env',
                        'jsonata',
                    ],
                    typeField: $('#node-input-' + setting.field + 'Type'),
                });
            });
            ['count', 'enableLogging'].forEach(function (field) {
                $('#node-input-' + field).typedInput({
                    default: 'bool',
                    types: ['bool', 'msg', 'flow', 'global', 'env', 'jsonata'],
                    typeField: $('#node-input-' + field + 'Type'),
                });
            });
            $('#node-input-additionalParameters').typedInput({
                default: 'json',
                types: ['json', 'msg', 'flow', 'global', 'jsonata', 'env'],
                typeField: $('#node-input-additionalParametersType'),
            });
            $('#node-input-output').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-outputType'),
            });
        },
    });
</script>

<script type="text/markdown" data-help-name="azure-ai-search-query">
Searches documents in an Azure AI Search index using the Search Documents REST API (`api-version=2026-04-01`).

### Authentication

Authentication is supplied by the selected **Azure Config**.

- **Microsoft Entra ID** requests a token for `https://search.azure.com/.default`.
- **API key** uses the generic API key stored in Azure Config and sends it in the `api-key` request header.

For query-only Entra access, assign the Node-RED identity the **Search Index Data Reader** role on the Azure AI Search service.

### Properties

- **Azure Config** _config_ \
  Existing shared Azure authentication configuration. No changes are required.

- **Endpoint** _string | env | msg | flow | global | jsonata_ \
  Search service endpoint, for example `https://my-search-service.search.windows.net`.

- **Index** _string | env | msg | flow | global | jsonata_ \
  Search index name or supported index alias.

- **Search Text** _typed value_ \
  Query text. The default is `msg.payload`. If it resolves empty and no vector query is supplied, the node sends `search: "*"`.

- **Query Type** _choice | msg | flow | global | env | jsonata_ \
  Azure AI Search query parser mode: `simple`, `full`, or `semantic`. The literal input keeps the existing choices.

- **Search Mode** _choice | msg | flow | global | env | jsonata_ \
  `any` or `all`. Controls whether any or all search terms must match.

- **Search Fields**, **Select** _string | msg | flow | global | env | jsonata_ \
  Optional comma-separated field-name strings (not arrays). An explicit empty string or `null` omits the parameter. A configured dynamic source that resolves to `undefined` fails the node.

- **Filter** _string | msg | flow | global | env | jsonata_ \
  OData filter expression, resolved for each incoming message. Select `msg` and enter `aiSearchFilter` to read `msg.aiSearchFilter`. For example: `contractNumberSearch eq '1234567890'`.

  An empty **string** leaves filtering disabled, as before. A dynamic source must resolve to a non-empty string; missing, empty, or non-string values fail the node before a request is sent. Use the string `false` to intentionally match no documents.

  Existing flows without `filterType` continue to use a literal string. **Parameters** can still override `filter` after this field is resolved and validated.

- **Top**, **Skip** _number | msg | flow | global | env | jsonata_ \
  Integer paging values: Top >= 1, Skip >= 0. Numbers or numeric strings are accepted. Empty strings or `null` omit these optional parameters; unresolved dynamic properties fail the node.

- **Total Count** _boolean | msg | flow | global | env | jsonata_ \
  Formerly the Return total count checkbox. Accepts boolean `true`/`false`, or the strings `"true"`/`"false"`. The string `"false"` is not treated as true.

- **Semantic Config** _string | msg | flow | global | env | jsonata_ \
  Optional semantic configuration name, normally used with Query Type = `semantic`. An empty string or `null` omits it; unresolved dynamic properties fail the node.

- **Timeout (ms)** _number | msg | flow | global | env | jsonata_ \
  Required integer >= 1000, default 30000. Resolved for each message.

- **Logging** _boolean | msg | flow | global | env | jsonata_ \
  Enables request metadata logging for the current message; default false.

- **Parameters** _JSON | msg | flow | global | jsonata | env_ \
  Additional Search Documents POST body properties. These values are applied after the editor fields and therefore can override them. Use this for advanced options such as `vectorQueries`, `facets`, `answers`, `captions`, `orderby`, `scoringProfile`, or `semanticQuery`.

  Example vector query:

  ```json
  {
      "vectorQueries": [
          {
              "kind": "text",
              "text": "how do clouds form",
              "fields": "contentVector",
              "k": 5
          }
      ]
  }
  ```

- **Value** _choice | msg | flow | global | env | jsonata_ \
  `documents` (Documents only) or `response` (Complete response object). Chooses what is written to the configured output property.

- **Output To** _msg | flow | global_ \
  Destination for the selected output value.

### Compatibility and dynamic values

Existing flows without the new type properties keep their literal values. Endpoint, Index, Search Text, Parameters, and Output To retain their existing typed-input support. Authentication and the Name label are unchanged.

Select the `msg` type and enter a path such as `aiSearch.select`, without the `msg.` prefix. Dynamic values are resolved using the existing property helper for every message; no resolved values are stored on the node. Invalid types, enum values, or missing dynamic sources fail before the HTTP request. Filter remains fail-closed, including for `null` and empty strings.

Parameters still override request-body fields after those fields have been resolved and validated. They cannot override the local Timeout, Logging, or output mode. Leave Parameters at `{}` unless an override is intended.

### Output

The incoming message is forwarded. Metadata is written to:

```js
msg.azureSearch = {
    requestId,
    indexName,
    apiVersion,
    count,
    coverage,
    answers,
    documentsReturned
};
```

With **Documents only**, the configured output receives the service response `value` array. With **Complete response object**, it receives the full JSON response.
</script>
