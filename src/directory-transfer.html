<script type="text/javascript">
    RED.nodes.registerType('azure-directory-transfer', {
        category: 'azure',
        color: '#0072C6',
        paletteLabel: 'directory-transfer',
        defaults: {
            name: { value: '' },
            config: { type: 'azure-file-config', required: true },
            shareName: {
                value: '',
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('shareNameType').call(this, v);
                },
            },
            shareNameType: { value: 'str' },
            dynamic: { value: false },
            action: { value: 'move' },
            source: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('sourceType').call(this, v);
                },
            },
            sourceType: { value: 'str' },
            destination: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('destinationType').call(this, v);
                },
            },
            destinationType: { value: 'str' },
            recursive: { value: true },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-exchange',
        label: function () {
            return (
                this.name ||
                (!this.dynamic
                    ? (this.action + ' ' + (this.source || '')).trim()
                    : 'directory-transfer')
            );
        },
        oneditprepare: function () {
            $('#node-input-shareName').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-shareNameType'),
            });
            $('#node-input-source').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-sourceType'),
            });
            $('#node-input-destination').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-destinationType'),
            });

            var $action = $('#node-input-action');
            var $actionRadios = $('input[name="node-input-action-radio"]');
            $actionRadios.filter('[value="' + $action.val() + '"]').prop('checked', true);
            $actionRadios.on('change', function () {
                $action.val(this.value).trigger('change');
            });

            $('#node-input-action').on('change', function () {
                var isCopy = $(this).val() === 'copy';
                $('#row-recursive label').html(
                    isCopy
                        ? '<i class="fa fa-files-o"></i> Copy recursively'
                        : '<i class="fa fa-plus"></i> Create target parents',
                );
            });

            $('#node-input-dynamic').on('change', function () {
                $('#directory-options-group').toggle(!$(this).prop('checked'));
                $('#node-input-action').trigger('change');
            });
            $('#node-input-dynamic').trigger('change');
        },
    });
</script>

<script type="text/markdown" data-help-name="azure-directory-transfer">
Copies or moves a directory inside one Azure Storage file share.

### Properties

- **Azure Files Config**: shared Azure Files service configuration.
- **Share Name**: Azure file-share name; always resolved from the configured typed property.
- **Load from msg.file**: reads `msg.file.action`, `msg.file.source`, `msg.file.destination`, and optional `msg.file.recursive`.
- **Action**: Move / Rename or Copy.
- **Recursive**: required for Copy. For Move / Rename it controls creation of missing destination parent directories.

Directory copy walks the source hierarchy and copies files in bounded ranges. Move / Rename uses the Azure Files rename operation within the same share.
</script>
