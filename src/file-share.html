<script type="text/javascript">
    RED.nodes.registerType('file-share', {
        category: 'azure',
        color: '#0072C6',
        defaults: {
            name: { value: '' },
            dynamic: { value: false },
            authType: { value: 'entra', required: true },
            serviceUrl: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-authType').length &&
                        $('#node-input-authType').val() === 'connectionString'
                    ) {
                        return true;
                    }
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('serviceUrlType').call(this, v);
                },
            },
            serviceUrlType: { value: 'str' },
            accountName: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-authType').length &&
                        $('#node-input-authType').val() !== 'accountKey'
                    ) {
                        return true;
                    }
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('accountNameType').call(this, v);
                },
            },
            accountNameType: { value: 'str' },
            operation: { value: 'list', required: true },
            shareName: {
                value: '',
                validate: function (v) {
                    var dynamic = $('#node-input-dynamic').length
                        ? $('#node-input-dynamic').prop('checked')
                        : this.dynamic;
                    if (dynamic) return true;
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('shareNameType').call(this, v);
                },
            },
            shareNameType: { value: 'str' },
            path: {
                value: '',
                validate: function (v) {
                    var dynamic = $('#node-input-dynamic').length
                        ? $('#node-input-dynamic').prop('checked')
                        : this.dynamic;
                    if (dynamic) return true;

                    var operation = $('#node-input-operation').length
                        ? $('#node-input-operation').val()
                        : this.operation;
                    if (operation === 'list' || operation === 'stat' || operation === 'exists') {
                        return !v || RED.validators.typedInput('pathType').call(this, v);
                    }
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('pathType').call(this, v);
                },
            },
            pathType: { value: 'str' },
            data: {
                value: 'payload',
                validate: function (v) {
                    var dynamic = $('#node-input-dynamic').length
                        ? $('#node-input-dynamic').prop('checked')
                        : this.dynamic;
                    var operation = $('#node-input-operation').length
                        ? $('#node-input-operation').val()
                        : this.operation;
                    if (dynamic || operation !== 'write') return true;
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('dataType').call(this, v);
                },
            },
            dataType: { value: 'msg' },
            writeFormat: { value: 'auto' },
            readFormat: { value: 'buffer' },
            contentType: { value: '' },
            contentTypeType: { value: 'str' },
            createParents: { value: true },
            overwrite: { value: true },
            recursive: { value: false },
            maxItems: {
                value: 1000,
                validate: function (v) {
                    return Number.isInteger(Number(v)) && Number(v) > 0;
                },
            },
            output: {
                value: 'fileShare',
                required: true,
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('outputType').call(this, v);
                },
            },
            outputType: { value: 'msg' },
            enableLogging: { value: false },
        },
        credentials: {
            accountKey: { type: 'password' },
            connectionString: { type: 'password' },
            sasToken: { type: 'password' },
        },
        oneditprepare: function () {
            $('#node-input-serviceUrl').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-serviceUrlType'),
            });
            $('#node-input-accountName').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-accountNameType'),
            });
            $('#node-input-shareName').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-shareNameType'),
            });
            $('#node-input-path').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-pathType'),
            });
            $('#node-input-data').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global', 'str', 'json', 'jsonata', 'env'],
                typeField: $('#node-input-dataType'),
            });
            $('#node-input-contentType').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-contentTypeType'),
            });
            $('#node-input-output').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-outputType'),
            });

            function updateAuthenticationRows() {
                var authType = $('#node-input-authType').val();
                $('#row-service-url').toggle(authType !== 'connectionString');
                $('#row-account-name').toggle(authType === 'accountKey');
                $('#row-account-key').toggle(authType === 'accountKey');
                $('#row-connection-string').toggle(authType === 'connectionString');
                $('#row-sas-token').toggle(authType === 'sas');
                $('#row-entra-help').toggle(authType === 'entra');
            }

            function updateOperationRows() {
                var dynamic = $('#node-input-dynamic').prop('checked');
                var operation = $('#node-input-operation').val();

                $('#file-operation-group').toggle(!dynamic);
                if (dynamic) return;

                $('#row-path').show();
                $('#row-data').toggle(operation === 'write');
                $('#row-write-format').toggle(operation === 'write');
                $('#row-content-type').toggle(operation === 'write');
                $('#row-read-format').toggle(operation === 'read');
                $('#row-create-parents').toggle(operation === 'write' || operation === 'mkdir');
                $('#row-overwrite').toggle(operation === 'write');
                $('#row-recursive').toggle(operation === 'list' || operation === 'rmdir');
                $('#row-max-items').toggle(operation === 'list');

                var pathLabel = 'File Path';
                var pathPlaceholder = 'folder/file.ext';
                if (operation === 'list' || operation === 'mkdir' || operation === 'rmdir') {
                    pathLabel = 'Directory Path';
                    pathPlaceholder = operation === 'list' ? 'optional/folder' : 'folder/subfolder';
                } else if (operation === 'stat' || operation === 'exists') {
                    pathLabel = 'Target Path';
                    pathPlaceholder = 'file or directory; blank means share root';
                }
                $('#label-path-text').text(pathLabel);
                $('#node-input-path').attr('placeholder', pathPlaceholder);
            }

            $('#node-input-authType').on('change', updateAuthenticationRows);
            $('#node-input-dynamic').on('change', updateOperationRows);
            $('#node-input-operation').on('change', updateOperationRows);

            updateAuthenticationRows();
            updateOperationRows();
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-folder-open',
        label: function () {
            return this.name || 'azure file share';
        },
        paletteLabel: 'file share',
    });
</script>

<script type="text/markdown" data-help-name="file-share">
Accesses files and directories in a classic Azure Storage Account file share by using `@azure/storage-file-share`.

### Supported operations

- **List directory**: lists files and directories. An empty path targets the share root.
- **Read file**: downloads a file as a Buffer, UTF-8 text, Base64, or parsed JSON.
- **Write file**: uploads or replaces a file from a Buffer, string, Base64 string, or object.
- **Delete file**: deletes a file if it exists.
- **Get properties**: returns file or directory properties.
- **Check existence**: checks whether a file or directory exists.
- **Create directory**: creates one directory or the full parent path.
- **Remove directory**: removes an empty directory or recursively deletes its contents.

### Authentication

- **Microsoft Entra ID** uses `DefaultAzureCredential` and Azure Files OAuth over REST with `fileRequestIntent: "backup"`.
- **Storage account key** stores the key in Node-RED credentials.
- **Connection string** stores the full connection string in Node-RED credentials.
- **SAS token** stores the token in Node-RED credentials and appends it to the file-service URL.

For Entra ID, assign a role containing the Azure Files backup-semantics data actions, such as **Storage File Data Privileged Reader** or **Storage File Data Privileged Contributor**, depending on the required operations.

### Dynamic input

When **Load operation from msg.fileShare** is enabled, provide operation parameters in:

```js
msg.fileShare = {
    operation: "write",
    shareName: "documents",
    path: "inbound/example.json",
    data: { hello: "world" },
    writeFormat: "json",
    contentType: "application/json",
    createParents: true,
    overwrite: true,
    recursive: false,
    maxItems: 1000,
    readFormat: "buffer"
};
```

Authentication remains configured on the node. The configured typed **Output To** property receives a result object.

### Output examples

Read:

```js
msg.fileShare = {
    action: "read",
    status: "succeeded",
    accountName: "account",
    shareName: "documents",
    path: "inbound/example.json",
    kind: "file",
    size: 18,
    format: "json",
    data: { hello: "world" },
    properties: { contentType: "application/json" }
};
```

List:

```js
msg.fileShare = {
    action: "list",
    status: "succeeded",
    shareName: "documents",
    path: "inbound",
    recursive: false,
    count: 2,
    list: [
        { kind: "file", name: "a.txt", path: "inbound/a.txt" },
        { kind: "directory", name: "archive", path: "inbound/archive" }
    ]
};
```

### Dependencies

```json
{
  "@azure/identity": "^4.0.0",
  "@azure/storage-file-share": "^12.32.0",
  "@faigle/node-red-runtime-utils": "<your current version>"
}
```
</script>
