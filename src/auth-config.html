<script type="text/javascript">
    RED.nodes.registerType('azure-auth-config', {
        category: 'config',
        defaults: {
            name: { value: '' },
            authType: { value: 'entra', required: true },
            accountName: {
                value: '',
                validate: function (v) {
                    var authType = $('#node-config-input-authType').length
                        ? $('#node-config-input-authType').val()
                        : this.authType;

                    if (authType !== 'accountKey') return true;
                    return !!v && v.trim() !== '';
                },
            },
        },
        credentials: {
            apiKey: { type: 'password' },
            accountKey: { type: 'password' },
            connectionString: { type: 'password' },
            sasToken: { type: 'password' },
        },
        label: function () {
            return this.name || this.accountName || 'Azure Config';
        },
        oneditprepare: function () {
            function updateAuthenticationRows() {
                var authType = $('#node-config-input-authType').val();

                $('#row-api-key').toggle(authType === 'apiKey');
                $('#row-account-name').toggle(authType === 'accountKey');
                $('#row-account-key').toggle(authType === 'accountKey');
                $('#row-connection-string').toggle(authType === 'connectionString');
                $('#row-sas-token').toggle(authType === 'sas');
                $('#row-entra-help').toggle(authType === 'entra');
            }

            $('#node-config-input-authType').on('change', updateAuthenticationRows);
            updateAuthenticationRows();
        },
    });
</script>

<script type="text/markdown" data-help-name="azure-auth-config">
Shared authentication configuration for Azure nodes.

### Authentication

- **Microsoft Entra ID** uses `DefaultAzureCredential`. Each consuming node requests the scope required by its Azure service.
- **API key** stores a generic Azure service API key in Node-RED credentials.
- **Storage account key**, **Storage connection string**, and **Storage SAS token** are intended for Azure File nodes.

</script>
