<script type="text/javascript">
    RED.nodes.registerType('document-intelligence', {
        category: 'azure',
        color: '#0072C6',
        defaults: {
            name: { value: '' },
            dynamic: { value: false },
            endpoint: { value: '', required: true },
            modelId: {
                value: 'prebuilt-document',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;
                    var builtInValidator = RED.validators.typedInput('modelIdType');
                    return builtInValidator.call(this, v);
                },
            },
            modelIdType: { value: 'str' },
            documentData: {
                value: 'payload',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;
                    var builtInValidator = RED.validators.typedInput('documentDataType');
                    return builtInValidator.call(this, v);
                },
            },
            documentDataType: { value: 'msg' },
            inputType: { value: 'auto' },
            output: { value: 'analysis', required: true },
            outputType: { value: 'msg' },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-file-text-o',
        label: function () {
            return this.name || 'document intelligence';
        },
        oneditprepare: function () {
            $('#node-input-modelId').typedInput({
                default: 'str',
                types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env'],
                typeField: $('#node-input-modelIdType'),
            });
            $('#node-input-documentData').typedInput({
                default: 'msg',
                types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env'],
                typeField: $('#node-input-documentDataType'),
            });
            $('#node-input-output').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-outputType'),
            });

            $('#node-input-dynamic').on('change', function () {
                if ($(this).prop('checked')) $('#document-options-group').hide();
                else $('#document-options-group').show();

                $('#node-input-modelId').trigger('change');
                $('#node-input-documentData').trigger('change');
            });

            $('#node-input-dynamic').trigger('change');
        },
    });
</script>

<script type="text/markdown" data-help-name="document-intelligence">
Analyzes a document utilizing Azure Document Intelligence and the `@azure/identity` `DefaultAzureCredential`.

### Properties

- **Load from msg.document** _boolean_ \
  If enabled, the node ignores the UI properties and expects `msg.document.modelId` and `msg.document.data` to be
  provided dynamically.

- **Endpoint URL** _string_ \
Your Azure Cognitive Services endpoint (e.g., `https://<resource-name>.cognitiveservices.azure.com/`).

- **Model / Prompt** _string | msg_ \
  The model ID to use (e.g., `prebuilt-document`, `prebuilt-receipt`, `prebuilt-layout` or a custom model ID).

- **Document Data** _string | buffer | msg_ \
  An HTTP/HTTPS URL string pointing to a document, or a binary Buffer of the file itself.

- **Input Format** _string_ \
  How to interpret the incoming document data (`auto`, `buffer`, `base64`, or `url`).

- **Output to** _msg | flow | global_ \
  The destination property where the analysis results will be stored.

---

### Inputs

- **msg.document** _object_ \
  The incoming message triggers the operation if dynamic loading is checked.

- **msg.document.modelId** _string_ \
  The model ID to run.

- **msg.document.data** _string | buffer_ \
  The URL or Buffer of the document to analyze.

- **msg.document.inputType** _string_ \
  Optional format override (`auto`, `buffer`, `base64`, or `url`).

### Outputs

- **msg.document** _object_ \
  The object containing the event details.

- **msg.document.action** _string_ \
  The action performed (`analyze`).

- **msg.document.status** _string_ \
  The status of the API operation.
</script>
