<script type="text/javascript">
    RED.nodes.registerType('document-intelligence', {
        category: 'azure',
        color: '#0072C6',
        defaults: {
            name: { value: '' },
            dynamic: { value: false },
            endpoint: { value: '', required: true },
            modelId: {
                value: 'prebuilt-document',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;
                    var builtInValidator = RED.validators.typedInput('modelIdType');
                    return builtInValidator.call(this, v);
                },
            },
            modelIdType: { value: 'str' },
            documentData: {
                value: 'payload',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;
                    var builtInValidator = RED.validators.typedInput('documentDataType');
                    return builtInValidator.call(this, v);
                },
            },
            documentDataType: { value: 'msg' },
            inputType: { value: 'auto' },
            outputContentFormat: { value: 'text' },
            pages: { value: '' },
            locale: { value: '' },
            stringIndexType: { value: 'utf16CodeUnit' },
            features: { value: '' },
            queryFields: { value: '' },
            outputOptions: { value: '' },
            output: { value: 'analysis', required: true },
            outputType: { value: 'msg' },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-file-text-o',
        label: function () {
            return this.name || 'document intelligence';
        },
        oneditprepare: function () {
            $('#node-input-modelId').typedInput({
                default: 'str',
                types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env'],
                typeField: $('#node-input-modelIdType'),
            });
            $('#node-input-documentData').typedInput({
                default: 'msg',
                types: ['str', 'msg', 'flow', 'global', 'jsonata', 'env'],
                typeField: $('#node-input-documentDataType'),
            });
            $('#node-input-output').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-outputType'),
            });

            $('#node-input-dynamic').on('change', function () {
                if ($(this).prop('checked')) {
                    $('#document-options-group').hide();
                    $('#document-params-group').hide();
                } else {
                    $('#document-options-group').show();
                    $('#document-params-group').show();
                }

                $('#node-input-modelId').trigger('change');
                $('#node-input-documentData').trigger('change');
            });

            $('#node-input-dynamic').trigger('change');
        },
    });
</script>

<script type="text/markdown" data-help-name="document-intelligence">
Analyzes a document utilizing Azure Document Intelligence (`api-version=2024-11-30`) and the `@azure/identity` `DefaultAzureCredential`.

### Properties

- **Load from msg.document** _boolean_ \
  If enabled, expects parameters dynamically under `msg.document` (`modelId`, `data`, `inputType`, `outputContentFormat`, `pages`, `locale`, `stringIndexType`, `features`, `queryFields`, `outputOptions`).

- **Endpoint URL** _string_ \
  Your Azure Cognitive Services endpoint (e.g., `https://<resource-name>.cognitiveservices.azure.com/`).

- **Model / Prompt** _string | msg_ \
  The model ID to use (e.g., `prebuilt-layout`, `prebuilt-invoice`, or a custom model ID).

- **Document Data** _string | buffer | msg_ \
  An HTTP/HTTPS URL string pointing to a document, or a binary Buffer of the file itself.

- **Content Format** _string_ \
  Format of the extracted text content (`text` or `markdown`).

- **Pages** _string_ \
  1-based page numbers to analyze (e.g., `"1-3, 5, 7-9"`).

- **Locale** _string_ \
  Locale hint for text recognition (e.g., `"en-US"`, `"de-DE"`).

- **String Index** _string_ \
  Method used to compute string offset and length (`utf16CodeUnit`, `textElements`, `unicodeCodePoint`).

- **Features** _string_ \
  Comma-separated list of optional add-on capabilities (`ocrHighResolution`, `barcodes`, `formulas`, `keyValuePairs`, `styleFont`, `languages`, `queryFields`).

- **Query Fields** _string_ \
  Comma-separated list of additional generative fields to extract on the fly (requires `features=queryFields`).

- **Add. Outputs** _string_ \
  Additional files to generate during analysis (`pdf`, `figures`).
</script>
