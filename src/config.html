<script type="text/javascript">
    RED.nodes.registerType('azure-config', {
        category: 'config',
        defaults: {
            name: { value: '' },
            authType: { value: 'entra', required: true },
            serviceUrl: {
                value: '',
                validate: function (v) {
                    var authType = $('#node-config-input-authType').length
                        ? $('#node-config-input-authType').val()
                        : this.authType;

                    if (authType === 'connectionString') return true;
                    return !!v && v.trim() !== '';
                },
            },
            accountName: {
                value: '',
                validate: function (v) {
                    var authType = $('#node-config-input-authType').length
                        ? $('#node-config-input-authType').val()
                        : this.authType;

                    if (authType !== 'accountKey') return true;
                    return !!v && v.trim() !== '';
                },
            },
        },
        credentials: {
            accountKey: { type: 'password' },
            connectionString: { type: 'password' },
            sasToken: { type: 'password' },
        },
        label: function () {
            return this.name || this.accountName || 'Azure Config';
        },
        oneditprepare: function () {
            function updateAuthenticationRows() {
                var authType = $('#node-config-input-authType').val();

                $('#row-service-url').toggle(authType !== 'connectionString');
                $('#row-account-name').toggle(authType === 'accountKey');
                $('#row-account-key').toggle(authType === 'accountKey');
                $('#row-connection-string').toggle(authType === 'connectionString');
                $('#row-sas-token').toggle(authType === 'sas');
                $('#row-entra-help').toggle(authType === 'entra');
            }

            $('#node-config-input-authType').on('change', updateAuthenticationRows);
            updateAuthenticationRows();
        },
    });
</script>

<link rel="stylesheet" href="resources/@faigle/node-red-runtime-utils/editor.css" />

<script type="text/html" data-template-name="azure-config">
    <div class="faigle-node-editor">
        <div class="form-row">
            <label for="node-config-input-name">

        <fieldset class="node-red-fieldset">

                <label for="node-config-input-authType">
                    <i class="fa fa-key"></i>
                    Authentication
                </label>
                <select id="node-config-input-authType">
                    <option value="entra">Microsoft Entra ID</option>
                    <option value="accountKey">Storage account key</option>
                    <option value="connectionString">Connection string</option>
                    <option value="sas">SAS token</option>
                </select>
            </div>

            <div class="form-row" id="row-service-url">
                <label for="node-config-input-serviceUrl">
                    <i class="fa fa-globe"></i>
                    Service URL
                </label>
                <input
                    type="text"
                    id="node-config-input-serviceUrl"
                    placeholder="https://account.file.core.windows.net or account name"
                />
            </div>

            <div class="form-row" id="row-account-name">
                <label for="node-config-input-accountName">
                    <i class="fa fa-building"></i>
                    Account Name
                </label>
                <input type="text" id="node-config-input-accountName" />
            </div>

            <div class="form-row" id="row-account-key">
                <label for="node-config-input-accountKey">
                    <i class="fa fa-lock"></i>
                    Account Key
                </label>
                <input type="password" id="node-config-input-accountKey" />
            </div>

            <div class="form-row" id="row-connection-string">
                <label for="node-config-input-connectionString">
                    <i class="fa fa-link"></i>
                    Conn String
                </label>
                <input type="password" id="node-config-input-connectionString" />
            </div>

            <div class="form-row" id="row-sas-token">
                <label for="node-config-input-sasToken">
                    <i class="fa fa-ticket"></i>
                    SAS Token
                </label>
                <input
                    type="password"
                    id="node-config-input-sasToken"
                    placeholder="sv=...&ss=f&..."
                />
            </div>

            <div class="form-row form-help-row" id="row-entra-help">
                <label></label>
                <div class="form-help">
                    Uses DefaultAzureCredential with Azure Files OAuth over REST and request intent
                    "backup".
                </div>
            </div>
        </fieldset>
    </div>
</script>

<script type="text/markdown" data-help-name="azure-config">
Shared authentication configuration for the Azure Files nodes.

### Authentication

- **Microsoft Entra ID** uses `DefaultAzureCredential` and Azure Files request intent `backup`.
- **Storage account key** uses the configured account name and account key.
- **Connection string** creates the Azure Files client directly from the connection string.
- **SAS token** appends the configured SAS token to the file-service URL.

### Service URL

For all authentication modes except **Connection string**, enter either the full Azure Files service URL or the storage account name.
</script>
