<script type="text/javascript">
    RED.nodes.registerType('azure-directory-watch', {
        category: 'azure',
        color: '#0072C6',
        paletteLabel: 'directory-watch',
        defaults: {
            name: { value: '' },
            config: { type: 'azure-file-config', required: true },
            shareName: {
                value: '',
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('shareNameType').call(this, v);
                },
            },
            shareNameType: { value: 'str' },
            source: {
                value: '',
                validate: function (v) {
                    if (!v || v.trim() === '') return true;
                    return RED.validators.typedInput('sourceType').call(this, v);
                },
            },
            sourceType: { value: 'str' },
            target: {
                value: 'file',
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('targetType').call(this, v);
                },
            },
            targetType: { value: 'msg' },
            depth: { value: 0 },
            pollInterval: { value: 5000 },
            watchAdd: { value: true },
            watchChange: { value: false },
            watchDelete: { value: false },
            filterFiles: { value: true },
            filterDirs: { value: false },
            awaitWriteFinish: { value: true },
            stabilityThreshold: { value: 2000 },
            ignoreInitial: { value: false },
            ignoredFiles: {
                value: '',
                validate: RED.validators.typedInput('ignoredFilesType'),
            },
            ignoredFilesType: { value: 're' },
        },

        inputs: 0,
        outputs: 1,

        icon: 'font-awesome/fa-eye',
        label: function () {
            return this.name || this.source || 'directory-watch';
        },

        oneditprepare: function () {
            $('#node-input-shareName').typedInput({
                default: 'str',
                types: ['flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-shareNameType'),
            });

            $('#node-input-source').typedInput({
                default: 'str',
                types: ['flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-sourceType'),
            });

            $('#node-input-target').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-targetType'),
            });

            $('#node-input-ignoredFiles').typedInput({
                default: this.ignoredFilesType || 're',
                types: ['re'],
                typeField: $('#node-input-ignoredFilesType'),
            });

            $('#node-input-awaitWriteFinish')
                .on('change', function () {
                    $('#row-stabilityThreshold').toggle($(this).is(':checked'));
                })
                .trigger('change');
        },

        onsave: function () {
            this.ignoredFilesType = $('#node-input-ignoredFilesType').val();
        },
    });
</script>

<script type="text/markdown" data-help-name="azure-directory-watch">
Watches a directory in an Azure Storage file share and emits added, changed, and deleted files or directories.

Azure Files does not expose native filesystem watch events, so this node polls the configured directory and compares snapshots.

### Properties

- **Azure Files Config**: shared Azure Files service configuration.
- **Share Name**: Azure file-share name.
- **Source Path**: directory path inside the share. Leave blank to watch the share root.
- **Output To**: property where the complete watch event object is stored. Defaults to `msg.file`.
- **Events**: emit Add, Change, or Delete events. Change applies to files.
- **Types**: emit events for Files, Directories, or both.
- **Ignore pattern**: optional regex matched against each file or directory name.
- **Depth**: subdirectory depth to scan (`0` scans only direct children of Source Path).
- **Poll interval**: milliseconds between completed scans. Minimum `250` ms; default `5000` ms.
- **Await write finish**: delays file Add/Change until its Azure properties remain unchanged for the stability threshold.
- **Threshold**: required stable time in milliseconds. Effective timing is bounded by the poll interval.
- **On start ignore files in folder**: uses the first scan only as the baseline instead of emitting Add events for existing items.

### Outputs

- **configured output property** _object_ — defaults to `msg.file`.

  - **action**: `add`, `change`, or `delete`.
  - **filetype**: `file` or `directory`.
  - **source**: configured Azure directory path inside the share.
  - **path**: complete normalized path inside the share.
  - **dir**: parent directory path.
  - **base**: file or directory name including extension.
  - **name**: file or directory name without extension.
  - **ext**: extension including the dot.
  - **stats**: Azure file/directory properties returned by `getProperties()`; `null` for deletes.

The node polls by listing Azure Files directories recursively up to **Depth** and uses Azure properties such as ETag, last-modified time, and content length to detect file changes.
</script>
