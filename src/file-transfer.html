<script type="text/javascript">
    RED.nodes.registerType('azure-file-transfer', {
        category: 'azure',
        color: '#0072C6',
        paletteLabel: 'file-transfer',
        defaults: {
            name: { value: '' },
            config: { type: 'azure-file-config', required: true },
            shareName: {
                value: '',
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('shareNameType').call(this, v);
                },
            },
            shareNameType: { value: 'str' },
            dynamic: { value: false },
            action: {
                value: 'move',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    return ['move', 'copy', 'delete'].includes(v);
                },
            },
            source: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('sourceType').call(this, v);
                },
            },
            sourceType: { value: 'str' },
            destination: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;

                    var action = $('#node-input-action').length
                        ? $('#node-input-action').val()
                        : this.action;
                    if (action === 'delete') return true;
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('destinationType').call(this, v);
                },
            },
            destinationType: { value: 'str' },
            createDir: { value: true },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-files-o',
        label: function () {
            return (
                this.name ||
                (!this.dynamic ? (this.action + ' ' + (this.source || '')).trim() : 'file-transfer')
            );
        },
        oneditprepare: function () {
            $('#node-input-shareName').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-shareNameType'),
            });
            $('#node-input-source').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-sourceType'),
            });
            $('#node-input-destination').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-destinationType'),
            });

            var $action = $('#node-input-action');
            var $actionRadios = $('input[name="node-input-action-radio"]');
            $actionRadios.filter('[value="' + $action.val() + '"]').prop('checked', true);
            $actionRadios.on('change', function () {
                $action.val(this.value).trigger('change');
            });

            $('#node-input-action').on('change', function () {
                var transfer = $(this).val() !== 'delete';
                $('#row-destination').toggle(transfer);
                $('#row-createDir').toggle(transfer);
                $('#node-input-destination').trigger('change');
            });

            $('#node-input-dynamic').on('change', function () {
                $('#file-options-group').toggle(!$(this).prop('checked'));
                $('#node-input-action').trigger('change');
            });

            $('#node-input-dynamic').trigger('change');
        },
    });
</script>

<script type="text/markdown" data-help-name="azure-file-transfer">
Moves, renames, copies, or deletes a file inside one Azure Storage file share.

### Properties

- **Azure Files Config**: shared Azure Files service configuration.
- **Share Name**: Azure file-share name; always resolved from the configured typed property.
- **Load from msg.file**: reads `msg.file.action`, `msg.file.source`, optional `msg.file.destination`, and optional `msg.file.createDir`.
- **Action**: Move / Rename, Copy, or Delete.
- **Source Path**: source file path inside the share.
- **Destination Path**: destination file path for Copy and Move / Rename.
- **Create target directory**: creates missing destination parent directories.

### Dynamic input

```js
msg.file = {
    action: 'copy',
    source: 'inbox/a.txt',
    destination: 'archive/a.txt',
    createDir: true
};
```

### Output

`msg.file` contains `filetype`, `action`, `source`, `destination`, `path`, and normalized path metadata.
</script>
