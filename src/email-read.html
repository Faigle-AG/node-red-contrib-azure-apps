<script type="text/javascript">
    RED.nodes.registerType('email-read', {
        category: 'azure',
        color: '#0072C6',
        defaults: {
            name: { value: '' },
            dynamic: { value: false },
            userId: {
                value: '',
                required: true,
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    var validator = RED.validators.typedInput('userIdType');
                    return validator.call(this, v);
                },
            },
            userIdType: { value: 'str' },
            folderId: { value: 'inbox', required: true },
            folderName: { value: 'Inbox' },
            limit: {
                value: 10,
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    return RED.validators.number()(v);
                },
            },
            downloadAttachments: { value: true },
            output: { value: 'emails', required: true },
            outputType: { value: 'msg' },
        },
        oneditprepare: function () {
            var currentFolderId = this.folderId || 'inbox';
            var currentFolderName = this.folderName || 'Inbox';

            $('#node-input-userId').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-userIdType'),
            });

            $('#node-input-output').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-outputType'),
            });

            var folderSelect = $('#node-input-folderId');

            folderSelect
                .empty()
                .append($('<option></option>').val(currentFolderId).text(currentFolderName));

            folderSelect.on('change', function () {
                $('#node-input-folderName').val($('#node-input-folderId option:selected').text());
            });

            function loadFolders(showWarning) {
                var userId = $('#node-input-userId').val();
                var userIdType = $('#node-input-userIdType').val();
                var button = $('#node-input-loadFolders');
                var selectedFolderId = folderSelect.val() || currentFolderId;

                if (userIdType !== 'str' || !userId || userId.trim() === '') {
                    if (showWarning) {
                        RED.notify('Folder loading requires a static User ID / Email.', 'warning');
                    }
                    return;
                }

                button.prop('disabled', true);
                folderSelect.prop('disabled', true);

                $.getJSON('email-read/folders', { userId: userId.trim() })
                    .done(function (folders) {
                        folderSelect.empty();

                        folders.forEach(function (folder) {
                            folderSelect.append(
                                $('<option></option>').val(folder.id).text(folder.path),
                            );
                        });

                        if (
                            folderSelect.find('option').filter(function () {
                                return $(this).val() === selectedFolderId;
                            }).length
                        ) {
                            folderSelect.val(selectedFolderId);
                        } else if (folderSelect.find('option[value="inbox"]').length) {
                            folderSelect.val('inbox');
                        } else if (folderSelect.find('option').length) {
                            folderSelect.prop('selectedIndex', 0);
                        }

                        folderSelect.trigger('change');
                    })
                    .fail(function (xhr) {
                        var message =
                            xhr.responseJSON && xhr.responseJSON.message
                                ? xhr.responseJSON.message
                                : 'Unable to load mail folders.';

                        if (showWarning) RED.notify(message, 'error');
                    })
                    .always(function () {
                        button.prop('disabled', false);
                        folderSelect.prop('disabled', false);
                    });
            }

            $('#node-input-loadFolders').on('click', function () {
                loadFolders(true);
            });

            $('#node-input-dynamic').on('change', function () {
                if ($(this).prop('checked')) $('#email-options-group').hide();
                else $('#email-options-group').show();
            });

            $('#node-input-dynamic').trigger('change');
            loadFolders(false);
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-envelope',
        label: function () {
            return this.name || 'email - read';
        },
    });
</script>

<script type="text/markdown" data-help-name="email-read">
Reads emails from an Azure user's selected mail folder utilizing the `@azure/identity` `DefaultAzureCredential`.

### Properties

- **Load from msg.email** _boolean_ \
  If enabled, the node will ignore the UI options and expect `msg.email.folderId`, `msg.email.limit`, and `msg.email.downloadAttachments` to be provided dynamically.

- **User ID / Email** _string | env | msg | flow | global | jsonata_ \
  The UserPrincipalName or Azure Object ID of the user whose mailbox you want to read. The value is evaluated for every incoming message.

- **Mail Folder** _string_ \
  The Microsoft Graph mail folder ID to read. Use **Load Folders** to retrieve all root and nested folders for a static User ID / Email.

- **Email Count** _number_ \
  The maximum number of emails to return (maps to OData `$top`).

- **Include Attachments** _boolean_ \
  If checked, requests the Graph API to expand and include file attachments in the response.

- **Output to** _msg | flow | global_ \
  The destination property where the retrieved array of emails will be stored.

---

### Inputs

- **msg.email** _object_ \
  The incoming message triggers the operation.

  - **msg.email.folderId** _string_ \
    The Microsoft Graph mail folder ID to read.

  - **msg.email.folderName** _string_ \
    Optional display name or path for the selected folder.

  - **msg.email.limit** _number_ \
    The maximum number of emails to return.

  - **msg.email.downloadAttachments** _boolean_ \
    Whether to include attachments.

### Outputs

- **msg.email** _object_ \
  The object containing the event details.

  - **msg.email.action** _string_ \
    The action performed (`read`).

  - **msg.email.folderId** _string_ \
    The Microsoft Graph ID of the folder that was read.

  - **msg.email.folderName** _string_ \
    The configured folder display name or path.

  - **msg.email.count** _number_ \
    The number of emails retrieved.
</script>
