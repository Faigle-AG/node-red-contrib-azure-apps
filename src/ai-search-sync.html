<script type="text/javascript">
    RED.nodes.registerType('azure-ai-search-sync', {
        category: 'azure',
        color: '#0072C6',
        defaults: {
            name: { value: '' },
            config: { type: 'azure-auth-config', required: true },
            endpoint: {
                value: '',
                required: true,
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('endpointType').call(this, v);
                },
            },
            endpointType: { value: 'str' },
            indexName: {
                value: '',
                required: true,
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('indexNameType').call(this, v);
                },
            },
            indexNameType: { value: 'str' },
            documents: {
                value: 'payload',
                required: true,
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('documentsType').call(this, v);
                },
            },
            documentsType: { value: 'msg' },
            action: { value: 'mergeOrUpload', required: true },
            batchSize: {
                value: 500,
                required: true,
                validate: function (v) {
                    return Number.isInteger(Number(v)) && Number(v) >= 1 && Number(v) <= 1000;
                },
            },
            timeoutMs: {
                value: 30000,
                required: true,
                validate: function (v) {
                    return Number.isInteger(Number(v)) && Number(v) >= 1000;
                },
            },
            failOnDocumentError: { value: true },
            output: {
                value: 'payload',
                required: true,
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('outputType').call(this, v);
                },
            },
            outputType: { value: 'msg' },
            outputMode: { value: 'summary', required: true },
            enableLogging: { value: false },
        },
        oneditprepare: function () {
            $('#node-input-endpoint').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-endpointType'),
            });
            $('#node-input-indexName').typedInput({
                default: 'str',
                types: ['str', 'env', 'msg', 'flow', 'global', 'jsonata'],
                typeField: $('#node-input-indexNameType'),
            });
            $('#node-input-documents').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global', 'json', 'jsonata', 'env'],
                typeField: $('#node-input-documentsType'),
            });
            $('#node-input-output').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-outputType'),
            });
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-cloud-upload',
        label: function () {
            return (
                this.name ||
                (this.indexName ? 'AI Search Sync: ' + this.indexName : 'ai search sync')
            );
        },
        paletteLabel: 'ai search sync',
    });
</script>

<script type="text/markdown" data-help-name="azure-ai-search-sync">
Uploads and synchronizes documents with an existing Azure AI Search index using the Documents - Index REST API (`api-version=2026-04-01`).

### Authentication

Authentication is supplied by the selected **Azure Config**. No changes to the shared auth-config node are required.

- **Microsoft Entra ID** requests a token for `https://search.azure.com/.default`.
- **API key** uses the generic API key stored in Azure Config and sends it in the `api-key` header. Use an admin key for document writes.

For Entra ID, assign the Node-RED identity the **Search Index Data Contributor** role on the Azure AI Search service.

### Input

**Documents** accepts any of these forms:

1. A single document object.
2. An array of document objects.
3. An Azure indexing payload with a `value` array.
4. A JSON string or Buffer containing one of the forms above.

Example:

```json
{
  "value": [
    {
      "id": "K0001",
      "custom-id": "K-100001",
      "Name": "Anna",
      "Lastname": "Keller"
    }
  ]
}
```

### Actions

- **Merge or Upload** is the recommended synchronization/upsert mode. Existing documents are merged; missing documents are created.
- **Upload** creates or replaces the complete document.
- **Merge** updates only supplied fields and fails if the document does not exist.
- **Delete** deletes documents. Azure only needs the index key field for each delete action.
- **From @search.action** preserves the `@search.action` value supplied by each document. Allowed values are `upload`, `merge`, `mergeOrUpload`, and `delete`.

When a fixed action is selected, the node sets or overrides `@search.action` on every supplied document.

### Batching

The node automatically splits requests to respect Azure AI Search push limits. **Batch Size** controls the maximum document count per request and must be between 1 and 1000. The node additionally splits before a request reaches the 16 MB indexing payload limit.

### Partial failures

Azure can accept a batch request while rejecting individual document actions. The node inspects each returned result.

If **Fail node if Azure rejects any document** is enabled, any per-document failure calls `done(err)` so a Node-RED Catch node can handle it. The details remain available on `msg.azureSearchSync`.

### Output

`msg.azureSearchSync` always contains the synchronization summary after Azure has processed all batches:

```json
{
  "action": "mergeOrUpload",
  "indexName": "customer",
  "apiVersion": "2026-04-01",
  "total": 8,
  "succeeded": 8,
  "failed": 0,
  "batches": 1,
  "results": []
}
```

The configured output can contain the summary, per-document results, or complete batch responses.

### Important

This node performs **push synchronization/upsert**. It does not automatically delete documents from Azure that are absent from the current input. Full source-of-truth reconciliation requires an explicit list of documents/keys to delete.
</script>
