<script type="text/javascript">
    RED.nodes.registerType('azure-directory-action', {
        category: 'azure',
        color: '#0072C6',
        paletteLabel: 'directory-action',
        defaults: {
            name: { value: '' },
            config: { type: 'azure-config', required: true },
            shareName: {
                value: '',
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('shareNameType').call(this, v);
                },
            },
            shareNameType: { value: 'str' },
            dynamic: { value: false },
            action: { value: 'list' },
            source: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;

                    var action = $('#node-input-action').length
                        ? $('#node-input-action').val()
                        : this.action;
                    if (action === 'list' && (!v || v.trim() === '')) return true;
                    if (!v || v.trim() === '') return false;
                    return RED.validators.typedInput('sourceType').call(this, v);
                },
            },
            sourceType: { value: 'str' },
            property: { value: 'file.content' },
            propertyType: { value: 'msg' },
            recursive: { value: true },
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-folder-o',
        label: function () {
            return (
                this.name ||
                (!this.dynamic
                    ? (this.action + ' ' + (this.source || '')).trim()
                    : 'directory-action')
            );
        },
        oneditprepare: function () {
            $('#node-input-shareName').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-shareNameType'),
            });
            $('#node-input-source').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-sourceType'),
            });
            $('#node-input-property').typedInput({
                default: 'msg',
                types: ['msg', 'flow', 'global'],
                typeField: $('#node-input-propertyType'),
            });

            var $action = $('#node-input-action');
            var $actionRadios = $('input[name="node-input-action-radio"]');
            $actionRadios.filter('[value="' + $action.val() + '"]').prop('checked', true);
            $actionRadios.on('change', function () {
                $action.val(this.value).trigger('change');
            });

            $('#node-input-action').on('change', function () {
                var action = $(this).val();
                $('#row-recursive').toggle(action === 'create' || action === 'delete');
                $('#row-recursive label').html(
                    action === 'delete'
                        ? '<i class="fa fa-trash"></i> Delete recursive inner folders'
                        : '<i class="fa fa-plus"></i> Create parent folders',
                );
                $('#node-input-source').trigger('change');
            });

            $('#node-input-dynamic').on('change', function () {
                $('#directory-options-group').toggle(!$(this).prop('checked'));
                $('#node-input-action').trigger('change');
            });

            $('#node-input-dynamic').trigger('change');
        },
    });
</script>

<script type="text/markdown" data-help-name="azure-directory-action">
Creates, deletes, or lists directories in an Azure Storage file share.

### Properties

- **Azure Config**: shared `azure-config` authentication configuration.
- **Share Name**: Azure file-share name; always resolved from the configured typed property.
- **Load from msg.file**: reads `msg.file.action`, `msg.file.path`, and optional `msg.file.recursive`.
- **Action**: Create, Delete, or List Contents.
- **Source Path**: path inside the share. For List Contents, an empty path lists the share root.
- **Recursive**: creates missing parent directories for Create or recursively removes children for Delete.
- **Output To**: Create/Delete writes `true`; List writes the complete directory metadata object including `contents`.

List output uses the same simple contents contract as the local `directory-action`: an array of child names.
</script>
